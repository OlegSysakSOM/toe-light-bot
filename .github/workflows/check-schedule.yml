name: TOE public bot — users and outage schedules

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

concurrency:
  group: toe-public-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository and encrypted state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Restore public TOE address directory cache
        uses: actions/cache@v4
        with:
          path: .cache/toe_address_index.json
          key: toe-address-index-v2-${{ runner.os }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Process Telegram inbox and refresh schedules when due
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          STATE_FILE: state.enc
          ADDRESS_INDEX_FILE: .cache/toe_address_index.json
          TIMEZONE: Europe/Kyiv
          MAX_ADDRESS_PAGES: "600"
          SCHEDULE_CHECK_INTERVAL_SECONDS: "900"
          LOG_LEVEL: INFO
        run: python bot.py --once

      - name: Persist encrypted user subscriptions and update offset
        if: always()
        run: |
          if [ -f state.enc ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f state.enc
            if ! git diff --cached --quiet; then
              git commit -m "Persist encrypted bot state [skip ci]"
              git push
            fi
          fi
